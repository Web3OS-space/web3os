name: Bug report
description: Something in the app, the node or the test network does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Rewards: the first reporter of a bug that gets fixed is recorded in [BUG_REWARDS.md](https://github.com/Web3OS-space/web3os/blob/main/BUG_REWARDS.md) by GitHub user id and may be paid after mainnet by a community vote; paid coins are locked like every network reward, with no promised unlock date. To claim, put this GitHub username in your Web3OS profile and later comment your mainnet address on this issue from this account. Security problems: email contact@web3os.space with SECURITY in the subject instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and the exact message on the screen if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line, so we can make it happen again.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options: [Windows, Linux, Android, TV, macOS (tester), iPhone (tester), Node / join kit, Website]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in Settings, or the date you downloaded it.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Never paste recovery words, passwords, authenticator codes or private keys.
